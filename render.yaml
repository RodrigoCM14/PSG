services:
  - type: web
    name: pukis-hub
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DATA_FILE
        value: /opt/render/project/src/data/hub.json
      - key: TMDB_READ_TOKEN
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
    disk:
      name: pukis-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
